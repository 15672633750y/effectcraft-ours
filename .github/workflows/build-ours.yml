# 编译缓存说明（2026-11-18）：
#   1. 编译产物在 artcraft/build/<app>/target —— builder 里是
#      export CARGO_TARGET_DIR="$ROOT/build/$APP/target"。以前缓存的是
#      artcraft/source/effectcraft/target，那个目录从来不存在，所以每轮
#      1 秒恢复、0 秒保存、全量重编。
#   2. 新 clone 的源码 mtime 全是新的，cargo 用 mtime 判 fresh，不归一的话
#      缓存命中也全量重编。归一必须放在**打补丁之前**：补丁改过的文件保持
#      新的 mtime 才会正确重编。
#   3. concurrency 用 run_id：新推送不再排队等前一个编完。
#   4. 构建后打印 target/.cargo/.gradle 体积，用来判断缓存是否真省到时间
#      （仓库 cache 上限 10 GB，超大条目会被 LRU 淘汰）。

name: Build EffectCraft APK (ours)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Upstream EffectCraft tag'
        required: false
        default: 'v0.24.1'
      package:
        description: 'Android package name (so builds can be installed side by side)'
        required: false
        default: 'com.shimoveaex.effects'
      patches:
        description: 'Apply our patches (yes/no). Use no for a test build of a bare upstream tag'
        required: false
        default: 'yes'

permissions:
  contents: write

concurrency:
  # 每次运行一个独立组：新推送既不会取消正在编的那一版，也不用排队等它 ——
  # 原来同组排队，推一次要等前一个 10 分钟编完才开始（20 分钟才出包）。
  group: ours-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      APP_NAME: 'ShimoveAex'
      ARTCRAFT_BUILD_TOOLS_VERSION: '35.0.0'
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '16'
      CARGO_PROFILE_RELEASE_LTO: 'false'
      CARGO_PROFILE_RELEASE_DEBUG: 'false'
    steps:
      - name: Check out our patch repository
        uses: actions/checkout@v4
        with:
          path: ours

      - name: Check out the Android builder
        uses: actions/checkout@v4
        with:
          repository: MostafaXS1/artcraft-android
          ref: v0.5.0
          path: artcraft

      - name: Check out the upstream EffectCraft source at the requested tag
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag || 'v0.24.1' }}"
          mkdir -p artcraft/source
          git clone --depth 1 --branch "$TAG" https://github.com/storytold/effectcraft artcraft/source/effectcraft
          git -C artcraft/source/effectcraft describe --tags --exact-match

      # cargo 以 mtime 判断“要不要重编”。每次 clone 出来的文件都是新的 mtime，
      # 缓存命中也照样全量重编，所以先把整棵源码树的时间归一到一个固定值。
      # 必须放在打补丁之前：补丁改过的文件保持“现在”的 mtime，才会正确触发重编
      # （反过来先 touch 再打补丁会让改过的文件也变“旧”，cargo 会误判 fresh，出坏包）。
      - name: Normalize the source timestamps for the Rust cache
        run: |
          set -euo pipefail
          find artcraft/source/effectcraft -path '*/.git' -prune -o -type f -exec touch -t 202001010000.00 {} +
          echo "source mtimes normalized to 2020-01-01"

      - name: Register the project/preset file associations
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('artcraft/lib/file_associations.py')
          s = p.read_text(encoding='utf-8')
          old = '    "effectcraft": ["ecproj", "ecprojx", "ectemplate"],'
          new = ('    "effectcraft": ["ecproj", "ecprojx", "ectemplate", "aep", "aepx",\n'
                 '                    "ffx", "gp", "xml", "nv"],')
          if old in s:
              p.write_text(s.replace(old, new, 1), encoding='utf-8')
              print('effectcraft now advertises .aep/.aepx/.ffx/.gp/.xml/.nv')
          elif '"aep"' in s:
              print('associations already extended')
          else:
              raise SystemExit('file_associations anchor missing')
          PY

      - name: Add the ImportShim trampoline
        run: |
          cp tools/ImportShim.java "$GITHUB_WORKSPACE/ImportShim.java"
          python3 tools/patch_builder_import_shim.py artcraft

      - name: Apply our patches (none yet)
        run: |
          set -euo pipefail
          if [ "${{ inputs.patches || 'yes' }}" = "yes" ] && [ -d ours/patches ]; then
            for p in ours/patches/*.py; do
              [ -e "$p" ] || continue
              EFFECTCRAFT_DIR="$GITHUB_WORKSPACE/artcraft/source/effectcraft" ARTCRAFT_DIR="$GITHUB_WORKSPACE/artcraft" python3 "$p"
            done
          else
            echo "No patches directory; building vanilla upstream."
          fi

      - name: Restore the persistent signing key
        id: signing_key_cache
        uses: actions/cache/restore@v4
        with:
          path: |
            artcraft/keys/artcraft-builder.jks
            artcraft/keys/.keystore-password
          key: ours-effectcraft-signing-v1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install --upgrade pillow

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configure the JDK the builder looks for
        run: |
          sudo mkdir -p /opt/jdk
          sudo ln -sfn "$JAVA_HOME" /opt/jdk/temurin-21

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
          key: ours-cargo-v2-${{ hashFiles('artcraft/source/effectcraft/Cargo.lock') || 'nolock' }}
          restore-keys: |
            ours-cargo-v2-
            ours-cargo-

      # cargo-ndk 是 curl 下来的单文件，单独缓存，省掉每次的下载
      - name: Cache cargo-ndk
        id: cargo_ndk_cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-ndk
          key: ours-cargo-ndk-v4.1.2

      # 编译产物缓存：builder 里 `export CARGO_TARGET_DIR="$ROOT/build/$APP/target"`，
      # 真正的产物在 artcraft/build/effectcraft/target（不是 source/effectcraft/target，
      # 那个路径从来不存在，所以以前每次都 1 秒恢复、0 秒保存、全量重编）。
      - name: Cache build output
        id: target_cache
        uses: actions/cache@v4
        with:
          path: |
            artcraft/build/effectcraft/target
          key: ours-target-v2-${{ hashFiles('artcraft/source/effectcraft/Cargo.lock') || 'nolock' }}-${{ github.run_id }}
          restore-keys: |
            ours-target-v2-${{ hashFiles('artcraft/source/effectcraft/Cargo.lock') || 'nolock' }}-
            ours-target-v2-
            ours-target-

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ours-gradle-v1
          restore-keys: ours-gradle-v1-

      - name: Report the Rust cache hit
        run: |
          echo "build-output cache hit: ${{ steps.target_cache.outputs.cache-hit || 'false' }}"
          echo "cargo-ndk cache hit:    ${{ steps.cargo_ndk_cache.outputs.cache-hit || 'false' }}"

      - name: Install cargo-ndk
        run: |
          if ! command -v cargo-ndk >/dev/null 2>&1; then
            mkdir -p "$HOME/.cargo/bin"
            curl -fsSL https://github.com/bbqsrc/cargo-ndk/releases/download/v4.1.2/cargo-ndk-x86_64-unknown-linux-musl-v4.1.2.tgz \
              | tar -xz --strip-components=1 -C "$HOME/.cargo/bin"
            chmod +x "$HOME/.cargo/bin/cargo-ndk"*
          fi
          cargo ndk -V

      - name: Configure the Android NDK
        run: |
          set -euo pipefail
          if [ -d "$ANDROID_HOME/ndk/27.2.12479018" ]; then
            echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
            echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          else
            LATEST_NDK="$(find "$ANDROID_HOME/ndk" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -n 1)"
            echo "ANDROID_NDK_HOME=$LATEST_NDK" >> "$GITHUB_ENV"
            echo "NDK_HOME=$LATEST_NDK" >> "$GITHUB_ENV"
          fi

      - name: Render the temporary launcher icon
        run: |
          set -euo pipefail
          if [ -f ours/tools/app-icon.png ]; then
            cp ours/tools/app-icon.png "$GITHUB_WORKSPACE/app-icon.png"
          else
            python3 ours/tools/make_icon.py "$GITHUB_WORKSPACE/app-icon.png"
          fi
          ls -l "$GITHUB_WORKSPACE/app-icon.png"

      - name: Use the fixed signing key (if configured)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -e
          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            mkdir -p artcraft/keys
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > artcraft/keys/artcraft-builder.jks
            printf '%s' "${KEYSTORE_PASSWORD:-}" > artcraft/keys/.keystore-password
            # 这里原来有一段 keytool -changealias，把别名从 shimove 改成 artcraftbuilder。
            # 而 310_signing_alias.py 让构建脚本用 ${ARTCRAFT_KEY_ALIAS:-shimove} —— 两边要的
            # 名字相反：改名成功的那次构建必然报「No key with alias 'shimove' found」
            # （903 就是这么挂的）。现在整段删掉，keystore 保持原别名 shimove，与 310 一致。
            echo "signing key restored from repository secrets (alias left untouched: shimove)"
          else
            echo "no KEYSTORE_BASE64 secret: the build keeps using/generating its cached key"
          fi

      - name: Build the APK
        env:
          IMPORT_SHIM_JAVA: ${{ github.workspace }}/ImportShim.java
        run: |
          set -o pipefail
          cd artcraft
          mkdir -p logs output
          bash build.sh -effectcraft --noupdate \
            -appname="${APP_NAME}" \
            -appicon="$GITHUB_WORKSPACE/app-icon.png" \
            -packagename="${{ inputs.package || 'com.shimoveaex.effects' }}" 2>&1 | tee logs/effectcraft-build.log

      # 诊断：文件关联是否真的进了打包的 manifest（构建后才存在）
      - name: Dump the intent filters really packaged
        if: always()
        run: |
          echo "== merged AndroidManifest.xml (text) =="
          find . -name AndroidManifest.xml 2>/dev/null | head -8 | while read -r f; do
            if grep -q 'intent-filter' "$f" 2>/dev/null; then
              echo "--- $f"
              grep -n 'intent-filter\|<data\|<activity\|<action' "$f" | head -40
            fi
          done
          echo "== aapt2 badging (what the launcher sees) =="
          APK=$(find . -name '*.apk' -newer /proc/self/exe 2>/dev/null | head -1)
          echo "apk=$APK"
          if [ -n "$APK" ] && command -v aapt2 >/dev/null 2>&1; then
            aapt2 dump badging "$APK" 2>/dev/null | grep -i 'launchable\|intent\|activity' | head -20
          fi

      # 诊断：缓存到底省了多少。没有这行，只能凭构建时长猜。
      - name: Report the build cache size
        if: always()
        run: |
          set +e
          echo "target dir:"
          du -sh artcraft/build/effectcraft/target 2>/dev/null || echo "  (missing)"
          echo "target/release/deps:"
          du -sh artcraft/build/effectcraft/target/release/deps 2>/dev/null || echo "  (missing)"
          echo "cargo home:"
          du -sh "$HOME/.cargo" 2>/dev/null || echo "  (missing)"
          echo "gradle home:"
          du -sh "$HOME/.gradle" 2>/dev/null || echo "  (missing)"

      - name: Save the signing key
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            artcraft/keys/artcraft-builder.jks
            artcraft/keys/.keystore-password
          key: ours-effectcraft-signing-v1

      - name: Rename the APK after the app
        run: |
          set -e
          cd artcraft/output
          for f in *.apk; do
            [ -e "$f" ] || continue
            case "$f" in
              ShimoveAex-*) ;;
              *) mv "$f" "ShimoveAex-${f}" ;;
            esac
          done
          ls -l *.apk

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: effectcraft-apk
          path: artcraft/output/*.apk
          if-no-files-found: error

      - name: Upload the build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: artcraft/logs/*.log
          if-no-files-found: ignore

      - name: Publish a prerelease with the APK
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ours-${{ github.run_number }}
          name: EffectCraft Android (ours) build ${{ github.run_number }}
          body: |
            Built from upstream storytold/effectcraft at ${{ inputs.tag || 'v0.24.1' }} with the artcraft-android builder.
            No third-party patch pipeline, no account gate.
          prerelease: true
          files: artcraft/output/*.apk
